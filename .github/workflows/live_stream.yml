name: 24/7 Cloud Broadcast Relay (16:9)

on:
  # schedule:
  #   # 24/7 Continuity Watchdog (Temporarily disabled pending copyright strike resolution & 100% original catalog migration)
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Streaming Duration in Hours (5.5h max per runner for continuous relay)'
        required: true
        default: '5.5'

permissions:
  contents: write
  actions: write

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # 5.8 hours max

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-deva
          pip install numpy scipy

      - name: Synthesize 100% Original Audio Catalog
        run: |
          python generate_original_catalog.py

      - name: Launch Cloud Media Broadcast Relay
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          HOURS: ${{ inputs.duration_hours || '5.5' }}
        run: |
          echo "=========================================================="
          echo "STARTING 24/7 CLOUD BROADCAST RELAY ENGINE"
          echo "Allocated Session Duration: $HOURS hours"
          echo "=========================================================="
          
          python live_system/master_live_streamer.py --hours "$HOURS"
